name: Morgenbriefing
version: "1.0.0"
slug: morgenbriefing
description: Zeigt das tägliche Morgenbriefing (HTML-Zeitung) aus einem GitHub-Repo in der Seitenleiste.
url: https://github.com/Syynax/ha-addons
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:newspaper-variant-outline
panel_title: Morgenbriefing
panel_admin: false
homeassistant_api: true
options:
  github_repo: ""
  github_branch: main
  github_token: ""
  poll_minutes: 15
schema:
  github_repo: str
  github_branch: str
  github_token: password?
  poll_minutes: int(5,1440)
